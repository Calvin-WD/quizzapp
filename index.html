<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuizApp</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="./styles/fonts.css" />
    <link rel="stylesheet" href="./styles/standard.css" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js"></script>
  </head>
  <body
    onload="init()"
    class="container-fluid d-flex flex-column justify-content-center align-items-center text-bg-secondary"
  >
    <h1>QuizzApp</h1>
    <section class="container d-flex justify-content-center">
      <nav class="navbar d-flex w-25 bg-custom rounded-start">
        <div id="Logo" class="container-fluid d-flex justify-content-center">
          <a class="navbar-brand d-flex justify-content-center m-0" href="#">
            <img src="./asset/logo.png" alt="Logo" class="img-fluid d-inline-block align-text-top w-75" />
          </a>
        </div>
        <div class="container-fluid px-0">
          <ul class="nav flex-column">
            <li class="nav-item">
              <a class="nav-link py-0 ps-lg-5 ps-md-4 ps-sm-3 my-2 text-light" href="#">HTML</a>
            </li>
            <li class="nav-item">
              <a class="nav-link py-0 ps-lg-5 ps-md-4 ps-sm-3 my-2 text-light" href="#">CSS</a>
            </li>
            <li class="nav-item">
              <a class="nav-link py-0 ps-lg-5 ps-md-4 ps-sm-3 my-2 text-light" href="#">JS</a>
            </li>
            <li class="nav-item">
              <a class="nav-link py-0 ps-lg-5 ps-md-4 ps-sm-3 my-2 text-light" href="#">Java</a>
            </li>
          </ul>
        </div>
      </nav>
      <div class="card rounded-start-0" style="width: 25rem">
        <div class="card-body">
          <h5 class="card-title text-center">Frage</h5>
          <div class="card mb-4">
            <div class="card-body d-flex gap-3">
              <div class="answer-badge">
                <b>A</b>
              </div>
              <div>Antwort</div>
            </div>
          </div>
          <div class="card mb-4">
            <div class="card-body d-flex gap-3">
              <div class="answer-badge">
                <b>B</b>
              </div>
              <div>Antwort</div>
            </div>
          </div>
          <div class="card mb-4">
            <div class="card-body d-flex gap-3">
              <div class="answer-badge">
                <b>C</b>
              </div>
              <div>Antwort</div>
            </div>
          </div>
          <div class="card mb-4">
            <div class="card-body d-flex gap-3">
              <div class="answer-badge">
                <b>D</b>
              </div>
              <div>Antwort</div>
            </div>
          </div>
        </div>
        <footer class="container-fluid d-flex justify-content-center pb-3">
          <button type="button" class="btn btn-primary rounded-pill"><b><</b></button>
          <div class="container-fluid d-flex justify-content-around align-items-center">
            <b>1.</b> von <b>5</b> Fragen
          </div>
          <button type="button" class="btn btn-primary rounded-pill"><b>></b></button>
        </footer>
      </div>
    </section>
    <!-- Bootstrap JavaScript -->
    <script src="./script.js"></script>
    <script src="./scripts/template.js"></script>
    <script src="./scripts/db.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
